<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found — Altitude</title>
  <meta name="description" content="The page you requested could not be found." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root{color-scheme:dark;--ink:#12141c;--paper:#f5f3ed;--accent:#ff5a36;--muted:#b8bbc5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
    main{width:min(720px,100%);text-align:center}
    .mark{width:72px;height:72px;margin:0 auto 32px;border-radius:18px;background:#1b2a4a;display:grid;place-items:center;font-weight:800;font-size:30px;letter-spacing:-.08em;color:var(--paper);box-shadow:0 18px 50px rgba(0,0,0,.28)}
    .code{font:500 14px/1.4 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
    h1{font-family:"Space Grotesk",system-ui,sans-serif;font-size:clamp(2.6rem,8vw,5.5rem);line-height:.95;letter-spacing:-.06em;margin:0 0 20px}
    p{max-width:48ch;margin:0 auto 32px;color:var(--muted);font-size:1.05rem;line-height:1.7}
    a{display:inline-block;padding:13px 20px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700}
    a:hover{filter:brightness(1.08)}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">A</div>
    <p class="code">Error / 404</p>
    <h1>That page took a wrong turn.</h1>
    <p>The page you're looking for doesn't exist here, or its URL may have changed.</p>
    <a href="index.html">Back to home</a>
  </main>
</body>
</html>
